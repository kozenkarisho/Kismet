name: kismet
description: AI-powered link organizer called Kismet.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_generative_ai: ^0.4.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.5
  webview_flutter: ^4.10.0
  share_plus: ^13.3.0
  receive_sharing_intent: 1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - .env
